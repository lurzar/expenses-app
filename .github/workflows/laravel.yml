name: Quality

on:
  push:
    branches:
      - main
      - v2.x
      - 'v2.*'
  pull_request:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Install locked PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare test application key
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Check PHP formatting
        run: composer format:test

      - name: Run static analysis
        run: composer analyse

      - name: Run isolated backend tests
        run: composer test

      - name: Audit locked PHP dependencies
        run: composer audit --locked --no-interaction

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test

      - name: Run strict TypeScript checks
        run: npm run typecheck

      - name: Build production assets
        run: npm run build

      - name: Audit locked frontend dependencies
        run: npm audit --package-lock-only
